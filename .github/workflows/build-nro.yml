name: Build Switch NRO
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-nro:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Switch toolchain
        run: |
          test -f "$DEVKITPRO/libnx/include/switch.h"
          test -f "$DEVKITPRO/portlibs/switch/include/SDL2/SDL.h"
      - name: Build NetflixNX
        run: make -j2
      - name: Verify output
        run: test -f netflixnx.nro
      - uses: actions/upload-artifact@v4
        with:
          name: NetflixNX-Switch
          path: |
            netflixnx.nro
            netflixnx.nacp
          if-no-files-found: error
